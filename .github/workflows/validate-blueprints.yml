# .github/workflows/validate-blueprints.yml
name: Validate Home Assistant blueprints

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-blueprints:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint blueprints YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 140}}}" blueprints/

