blueprint:
  name: Motion-activated Light with Sun Conditions
  description: |
    Motion-activated light control with optional sunset/sunrise conditions.

    Behavior:
    - If both sun options are disabled -> always active
    - If only sunset is enabled -> active after sunset (with offset)
    - If only sunrise is enabled -> active before sunrise (with offset)
    - If both are enabled -> active when any sun condition is met
  domain: automation

  input:
    motion_entity:
      name: Motion Sensor
      description: Motion or occupancy sensor used to detect presence
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    light_target:
      name: Target Light(s)
      description: Light or group of lights to control
      selector:
        target:
          entity:
            domain: light

    no_motion_wait:
      name: No-motion Timeout
      description: Time in seconds to keep the light on after the last motion
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          step: 1
          unit_of_measurement: seconds

    enable_sunset_condition:
      name: Enable Sunset Condition
      description: Only activate after sunset (with optional offset)
      default: false
      selector:
        boolean: {}

    sunset_offset:
      name: Sunset Offset
      description: >
        Offset relative to sunset (format HH:MM:SS, negative allowed, e.g. "-00:30:00" or "01:00:00").
      default: "00:00:00"
      selector:
        text:
          multiline: false

    enable_sunrise_condition:
      name: Enable Sunrise Condition
      description: Only activate before sunrise (with optional offset)
      default: false
      selector:
        boolean: {}

    sunrise_offset:
      name: Sunrise Offset
      description: >
        Offset relative to sunrise (format HH:MM:SS, negative allowed, e.g. "-01:00:00" or "00:30:00").
      default: "00:00:00"
      selector:
        text:
          multiline: false

mode: restart
max_exceeded: silent

variables:
  var_enable_sunset: !input enable_sunset_condition
  var_enable_sunrise: !input enable_sunrise_condition

trigger:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"

condition:
  - condition: or
    conditions:
      # 1) If both sun options are disabled -> always allow
      - condition: template
        alias: "No sun conditions enabled"
        value_template: >
          {{ not var_enable_sunset and not var_enable_sunrise }}

      # 2) After sunset with offset
      - condition: and
        alias: "After sunset with offset"
        conditions:
          - condition: template
            value_template: "{{ var_enable_sunset }}"
          - condition: sun
            after: sunset
            after_offset: !input sunset_offset

      # 3) Before sunrise with offset
      - condition: and
        alias: "Before sunrise with offset"
        conditions:
          - condition: template
            value_template: "{{ var_enable_sunrise }}"
          - condition: sun
            before: sunrise
            before_offset: !input sunrise_offset

action:
  - alias: "Turn on target light(s)"
    service: light.turn_on
    target: !input light_target

  - alias: "Wait for motion to clear"
    wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        from: "on"
        to: "off"

  - alias: "Wait configured no-motion timeout"
    delay:
      seconds: !input no_motion_wait

  - alias: "Turn off target light(s)"
    service: light.turn_off
    target: !input light_target
