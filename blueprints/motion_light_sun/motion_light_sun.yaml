blueprint:
  name: Motion-activated Light with Sun Conditions
  description: |
    Advanced motion-activated light control with optional sunset/sunrise conditions.

    Features:
    • Configurable time offsets (±60min) using templates
    • Restart mode (new motion resets timer)
    • Graphical YAML editor compatible
  domain: automation
  source_url: https://github.com/jsilarow/home-assistant-blueprints

  input:
    motion_entity:
      name: Motion Sensor
      description: Motion or occupancy sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    light_target:
      name: Light(s)
      description: Light or group of lights to control
      selector:
        target:
          entity:
            domain: light

    no_motion_wait:
      name: No Motion Wait Time
      description: Seconds to keep light on after last motion detected
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          step: 1
          unit_of_measurement: seconds

    enable_sunset_condition:
      name: Enable Sunset Condition
      description: Only activate after sunset (with configurable offset, minutes)
      default: false
      selector:
        boolean: {}

    sunset_offset:
      name: Sunset Offset (minutes)
      description: Positive = after sunset, negative = before sunset
      default: 0
      selector:
        number:
          min: -60
          max: 60
          step: 1
          unit_of_measurement: minutes

    enable_sunrise_condition:
      name: Enable Sunrise Condition
      description: Only activate before sunrise (with configurable offset, minutes)
      default: false
      selector:
        boolean: {}

    sunrise_offset:
      name: Sunrise Offset (minutes)
      description: Positive = after sunrise, negative = before sunrise
      default: 0
      selector:
        number:
          min: -60
          max: 60
          step: 1
          unit_of_measurement: minutes

mode: restart
max_exceeded: silent

# Expose inputs as variables for use in templates
variables:
  var_enable_sunset: !input enable_sunset_condition
  var_enable_sunrise: !input enable_sunrise_condition
  var_sunset_offset: !input sunset_offset
  var_sunrise_offset: !input sunrise_offset

trigger:
  - trigger: state
    entity_id: !input motion_entity
    from: "off"
    to: "on"

condition:
  - condition: or
    conditions:
      # 1) No sun conditions enabled -> always allow
      - condition: template
        alias: "No sun conditions enabled"
        value_template: >
          {{ (var_enable_sunset is not true) and (var_enable_sunrise is not true) }}

      # 2) After (sunset + offset)
      - condition: template
        alias: "After sunset with offset"
        value_template: >
          {% if var_enable_sunset %}
            {% set sunset_dt = as_local(as_datetime(state_attr('sun.sun', 'next_setting'))) %}
            {% set target_dt = sunset_dt + timedelta(minutes=var_sunset_offset | int(0)) %}
            {{ now() >= target_dt }}
          {% else %}
            false
          {% endif %}

      # 3) Before (sunrise + offset)
      - condition: template
        alias: "Before sunrise with offset"
        value_template: >
          {% if var_enable_sunrise %}
            {% set sunrise_dt = as_local(as_datetime(state_attr('sun.sun', 'next_rising'))) %}
            {% set target_dt = sunrise_dt + timedelta(minutes=var_sunrise_offset | int(0)) %}
            {{ now() <= target_dt }}
          {% else %}
            false
          {% endif %}

action:
  - alias: Turn on light
    service: light.turn_on
    target: !input light_target

  - alias: Wait for no motion
    wait_for_trigger:
      - trigger: state
        entity_id: !input motion_entity
        from: "on"
        to: "off"

  - alias: Wait configured time
    delay:
      seconds: !input no_motion_wait

  - alias: Turn off light
    service: light.turn_off
    target: !input light_target
